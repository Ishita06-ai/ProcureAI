name: AI Agent Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node:test's mock.module (used by src/ai/tools/*.tool.test.js) needs
      # Node >= 22.3 and the --experimental-test-module-mocks flag.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI agent test suite
        run: npm run test